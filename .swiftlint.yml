included:
  - PhotoGratitudeJournal
  - PhotoGratitudeJournalTests

# Calibrated to the existing codebase style: SwiftUI view builders run long
# and descriptive identifiers are preferred over short ones.
line_length:
  warning: 180
  error: 240

type_body_length:
  warning: 500
  error: 800

file_length:
  warning: 800
  error: 1200

function_body_length:
  warning: 80
  error: 150

identifier_name:
  min_length: 2

disabled_rules:
  - todo
  - trailing_whitespace
  - multiple_closures_with_trailing_closure
